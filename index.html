<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>App Call & Chat Full Feature</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; background: #f0f2f5; }
    #sidebar { width: 300px; background: #fff; border-right: 1px solid #ccc; display: flex; flex-direction: column; }
    .header { padding: 15px; background: #0084ff; color: white; display: flex; justify-content: space-between; align-items: center; }
    .user-item { padding: 10px 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .status-dot { width: 10px; height: 10px; background: #4caf50; border-radius: 50%; display: inline-block; }
    #chat-area { flex: 1; display: flex; flex-direction: column; }
    #messages { flex: 1; padding: 20px; overflow-y: auto; }
    #chat-input { display: flex; padding: 10px; background: #fff; }
    #chat-input input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    #chat-input button { padding: 10px 20px; background: #0084ff; color: white; border: none; margin-left: 10px; border-radius: 4px; }
    #video-container { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    video { width: 45%; border-radius: 8px; margin: 10px; background: #222; }
    #modal-settings { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 99; }
    .modal-content { background: white; padding: 20px; border-radius: 8px; width: 400px; }
  </style>
</head>
<body>

  <!-- Sidebar: Bạn bè & Cài đặt -->
  <div id="sidebar">
    <div class="header">
      <span id="my-name">User</span>
      <button onclick="toggleSettings(true)">⚙️ Cài đặt</button>
    </div>
    <div style="padding: 10px;">
      <input type="text" id="username-input" placeholder="Nhập tên của bạn..." style="width:100%; padding:8px;" onchange="setUser(this.value)">
    </div>
    <h4 style="padding: 10px;">Bạn bè Online</h4>
    <div id="user-list"></div>
  </div>

  <!-- Chat Area -->
  <div id="chat-area">
    <div id="messages"></div>
    <div id="chat-input">
      <input type="text" id="msg-text" placeholder="Nhập tin nhắn..." onkeydown="if(event.key==='Enter') sendMsg()">
      <button onclick="sendMsg()">Gửi</button>
    </div>
  </div>

  <!-- Screen Gọi Video (WebRTC) -->
  <div id="video-container">
    <div style="display:flex; width: 100%; justify-content: center;">
      <video id="localVideo" autoplay muted></video>
      <video id="remoteVideo" autoplay></video>
    </div>
    <button onclick="endCall()" style="padding: 10px 30px; background: red; color: white; border: none; border-radius: 4px; margin-top: 20px;">Kết thúc cuộc gọi</button>
  </div>

  <!-- Modal Cài đặt & Test Thiết bị -->
  <div id="modal-settings">
    <div class="modal-content">
      <h3>Cài đặt ứng dụng</h3>
      <hr style="margin: 10px 0;">
      <h4>Kiểm tra Camera / Mic</h4>
      <video id="testVideo" autoplay muted style="width: 100%; height: 150px; margin-top: 10px;"></video>
      <br><br>
      <button onclick="startTestMedia()">Bật Test Cam/Mic</button>
      <button onclick="toggleSettings(false)" style="float: right;">Đóng</button>
    </div>
  </div>

  <script>
    const socket = io();
    let localStream, peerConnection;
    let targetSocketId = null;

    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    function setUser(name) {
      if (!name) return;
      document.getElementById('my-name').innerText = name;
      socket.emit('register_user', name);
    }

    // --- 1. SỰ KIỆN CHAT & USER LIST ---
    socket.on('update_user_list', (users) => {
      const listEl = document.getElementById('user-list');
      listEl.innerHTML = '';
      users.forEach(u => {
        if (u.id !== socket.id) {
          listEl.innerHTML += `
            <div class="user-item">
              <span><span class="status-dot"></span> ${u.username}</span>
              <div>
                <button onclick="startCall('${u.id}')">📞 Call</button>
              </div>
            </div>`;
        }
      });
    });

    function sendMsg() {
      const input = document.getElementById('msg-text');
      if (input.value.trim()) {
        socket.emit('send_message', { text: input.value });
        input.value = '';
      }
    }

    socket.on('receive_message', (data) => {
      const msgBox = document.getElementById('messages');
      msgBox.innerHTML += `<div><b>${data.sender}</b> [${data.time}]: ${data.text}</div>`;
      msgBox.scrollTop = msgBox.scrollHeight;
    });

    // --- 2. SỰ KIỆN GỌI VIDEO (WEBRTC) ---
    async function startCall(userToCall) {
      targetSocketId = userToCall;
      document.getElementById('video-container').style.display = 'flex';
      
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      document.getElementById('localVideo').srcObject = localStream;

      peerConnection = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      peerConnection.ontrack = (e) => {
        document.getElementById('remoteVideo').srcObject = e.streams[0];
      };

      peerConnection.onicecandidate = (e) => {
        if (e.candidate) {
          // Xử lý luồng Candidate gửi qua socket (rút gọn trong phiên bản cơ bản này)
        }
      };

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      socket.emit('call_user', { userToCall, signalData: offer });
    }

    socket.on('incoming_call', async (data) => {
      if (confirm(`Cuộc gọi đến từ ${data.name}. Bạn có muốn nghe?`)) {
        targetSocketId = data.from;
        document.getElementById('video-container').style.display = 'flex';

        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;

        peerConnection = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = (e) => {
          document.getElementById('remoteVideo').srcObject = e.streams[0];
        };

        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        socket.emit('answer_call', { to: data.from, signal: answer });
      }
    });

    socket.on('call_accepted', async (signal) => {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(signal));
    });

    function endCall() {
      document.getElementById('video-container').style.display = 'none';
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peerConnection) peerConnection.close();
    }

    // --- 3. CÀI ĐẶT & TEST MEDIA ---
    function toggleSettings(show) {
      document.getElementById('modal-settings').style.display = show ? 'flex' : 'none';
    }

    async function startTestMedia() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('testVideo').srcObject = stream;
      } catch (err) {
        alert('Không thể mở Camera/Microphone!');
      }
    }
  </script>
</body>
      </html>
